# Central configuration. Paths are relative to the project root unless absolute.

jsoc:
  email: "ganeshbehera36510@gmail.com"          # <-- replace with the e-mail registered at JSOC
  series: "hmi.sharp_cea_720s"
  segment: "Br"
  query_chunk_days: 7               # split keyword queries into chunks to avoid timeouts

download:
  workers: 8                        # parallel HTTP download threads (benchmark tests 1, 4 and 8)
  export_chunk_records: 120         # max records per JSOC export request (Module 3)
  timeout_s: 60                     # per-request timeout
  retries: 3                        # retries per file, exponential backoff
  tar_timeout_s: 120                # url-tar: per-request timeout for the .tar download
  tar_retries: 3                    # url-tar: retries for the tar download and for the export request
  tar_workers: 1                    # url-tar: chunks (tars) processed concurrently

paths:
  data_dir: "data"
  outputs_dir: "outputs"
  samples_csv: "outputs/index/samples_final.csv"   # Module 4: sample index (included rows are used)
  frames_dir: "data/processed/frames"              # Module 4: per-frame .npy files (read-only)
  cache_dir: "data/processed/cache"                # packed float16 frame cache (04b_build_cache.py)

loader:                             # Module 4 defaults (batch size from decisions.md §9)
  batch_size: 8                     # decisions.md §9, Change Log 12 (batch 16 peaks ~3.1 GB for E2/E3)
  num_workers: 4                    # Module 4b benchmark (E4, cache): epoch 2 = 66 s (0 workers), 61 s (4), 61 s (8); 4 chosen
  use_cache: true                   # read frames from the packed cache (decisions.md Change Log 14)

pilot:
  start: "2024-05-01T00:00:00"      # pilot month (very active month, AR 13664): exercises M/X association
  end:   "2024-06-01T00:00:00"      # exclusive
  download_test:
    enabled: true
    n_hours: 4                      # export one HARP's Br frames for this many hours (~20 frames)

period:                             # Module 2 observation period (end exclusive, month starts)
  start: "2023-01-01T00:00:00"
  end:   "2025-07-01T00:00:00"      # extended from 2025-02-01 (adds 2025-02 ... 2025-06)
  priority_years: [2024, 2023]      # process these years first (in this order), then the remaining months

completeness:                       # catalogue-completeness rule (decisions.md §10, Change Log 10)
  min_share_with_noaa: 0.80         # keep a month only if >= this share of its >=M flares have a NOAA number
  expected_kept_first: "2024-01"    # sanity check only: the script STOPs if the kept set differs from this range
  expected_kept_last: "2025-06"

split:
  pattern: [train, train, train, val, test]   # HARP-grouped month blocks (decisions.md §10)

flares:
  source: "hek"                     # HEK via SunPy
  frm_name: "SWPC"                  # keep a single catalogue source
  hek_timeout_s: 300                # socket timeout for HEK queries (a stalled query now fails instead of hanging)
  association_window_hours: 1.0     # match NOAA number to HARP records within ±1 h of flare start

samples:
  grid_hours: 6                     # t on 00/06/12/18
  forecast_start_hours: 6           # window [t+6h, t+24h)
  forecast_end_hours: 24
  persistence_hours: 24             # E0 looks back [t-24h, t)
  frame_step_minutes: 24            # E2 / fine grid
  n_frames_full: 31                 # 12 h @ 24 min (E2); coarse = every 2nd of these, fine = last 16
  max_substitutions: 3
  limb_max_deg: 68.0
  quality_good_values: [0]          # PILOT: refine after inspecting the QUALITY distribution
  require_noaa: true

preprocess:
  image_size: 128
  clip_gauss: 1500.0
  dtype: "float16"
